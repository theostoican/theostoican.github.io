<svg width="100%" viewBox="0 0 400 360" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
<title>The XOR problem in 2D</title>
<desc>Four points at the corners of a unit square: (0,0) and (1,1) are red, (1,0) and (0,1) are blue. No straight line separates the two classes.</desc>
<style>
.th { font: 600 14px system-ui, sans-serif; fill: #333; }
.ts { font: 12px system-ui, sans-serif; fill: #666; }
</style>
<defs>
<marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="th" x="200" y="30" text-anchor="middle">XOR — not linearly separable</text>

<g transform="translate(200,220)">
  <line x1="-30" y1="0" x2="160" y2="0" stroke="#999" stroke-width="0.5" marker-end="url(#arrow1)"/>
  <line x1="0" y1="30" x2="0" y2="-150" stroke="#999" stroke-width="0.5" marker-end="url(#arrow1)"/>
  <text class="ts" x="166" y="4">x₁</text>
  <text class="ts" x="8" y="-146">x₂</text>

  <line x1="-30" y1="120" x2="120" y2="-30" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3" opacity="0.35"/>
  <line x1="-30" y1="-30" x2="120" y2="120" stroke="#185FA5" stroke-width="1" stroke-dasharray="4 3" opacity="0.35"/>

  <circle cx="0" cy="0" r="7" fill="#D85A30"/>
  <text class="ts" x="-12" y="18" text-anchor="end" fill="#993C1D">(0,0)</text>
  <circle cx="100" cy="0" r="7" fill="#378ADD"/>
  <text class="ts" x="100" y="20" text-anchor="middle" fill="#185FA5">(1,0)</text>
  <circle cx="0" cy="-100" r="7" fill="#378ADD"/>
  <text class="ts" x="-12" y="-96" text-anchor="end" fill="#185FA5">(0,1)</text>
  <circle cx="100" cy="-100" r="7" fill="#D85A30"/>
  <text class="ts" x="114" y="-96" fill="#993C1D">(1,1)</text>
</g>

<g transform="translate(120,320)">
  <rect x="0" y="0" width="22" height="22" rx="4" fill="#D85A30" stroke="#993C1D" stroke-width="0.5"/>
  <text class="ts" x="30" y="15">class 0</text>
  <rect x="100" y="0" width="22" height="22" rx="4" fill="#378ADD" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="130" y="15">class 1</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
