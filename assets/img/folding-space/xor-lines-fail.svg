<svg width="100%" viewBox="0 0 680 280" role="img" xmlns="http://www.w3.org/2000/svg">
<title>No straight line separates the XOR classes</title>
<desc>Three attempts at a linear separator for the XOR points. In each, exactly one blue or one red point ends up on the wrong side of the line.</desc>
<style>
.th { font: 600 14px system-ui, sans-serif; fill: #333; }
.ts { font: 12px system-ui, sans-serif; fill: #666; }
</style>

<text class="th" x="120" y="30" text-anchor="middle">Attempt 1: vertical</text>
<text class="ts" x="120" y="48" text-anchor="middle" fill="#993C1D">(1,1) on the wrong side</text>

<g transform="translate(120,180)">
  <line x1="-70" y1="0" x2="70" y2="0" stroke="#999" stroke-width="0.5"/>
  <line x1="0" y1="20" x2="0" y2="-100" stroke="#999" stroke-width="0.5"/>

  <line x1="30" y1="20" x2="30" y2="-100" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4 3"/>

  <circle cx="0" cy="0" r="6" fill="#D85A30"/>
  <circle cx="50" cy="0" r="6" fill="#378ADD"/>
  <circle cx="0" cy="-50" r="6" fill="#378ADD"/>
  <circle cx="50" cy="-50" r="6" fill="#D85A30" stroke="#993C1D" stroke-width="2"/>
</g>

<text class="th" x="340" y="30" text-anchor="middle">Attempt 2: diagonal</text>
<text class="ts" x="340" y="48" text-anchor="middle" fill="#993C1D">(0,1) on the wrong side</text>

<g transform="translate(340,180)">
  <line x1="-70" y1="0" x2="70" y2="0" stroke="#999" stroke-width="0.5"/>
  <line x1="0" y1="20" x2="0" y2="-100" stroke="#999" stroke-width="0.5"/>

  <line x1="-20" y1="20" x2="70" y2="-70" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4 3"/>

  <circle cx="0" cy="0" r="6" fill="#D85A30"/>
  <circle cx="50" cy="0" r="6" fill="#378ADD"/>
  <circle cx="0" cy="-50" r="6" fill="#378ADD" stroke="#185FA5" stroke-width="2"/>
  <circle cx="50" cy="-50" r="6" fill="#D85A30"/>
</g>

<text class="th" x="560" y="30" text-anchor="middle">Attempt 3: horizontal</text>
<text class="ts" x="560" y="48" text-anchor="middle" fill="#993C1D">(1,1) on the wrong side</text>

<g transform="translate(560,180)">
  <line x1="-70" y1="0" x2="70" y2="0" stroke="#999" stroke-width="0.5"/>
  <line x1="0" y1="20" x2="0" y2="-100" stroke="#999" stroke-width="0.5"/>

  <line x1="-20" y1="-25" x2="70" y2="-25" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4 3"/>

  <circle cx="0" cy="0" r="6" fill="#D85A30"/>
  <circle cx="50" cy="0" r="6" fill="#378ADD"/>
  <circle cx="0" cy="-50" r="6" fill="#378ADD"/>
  <circle cx="50" cy="-50" r="6" fill="#D85A30" stroke="#993C1D" stroke-width="2"/>
</g>

<text class="ts" x="340" y="260" text-anchor="middle" fill="#666">Every orientation of a line puts at least one point in the wrong class.</text>
</svg>
