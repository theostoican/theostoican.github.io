<svg width="100%" viewBox="0 0 680 460" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
<title>A single neuron with a squaring nonlinearity separates XOR</title>
<desc>Left shows the four XOR points in 2D. Right shows their images on a 1D line after applying the map phi(x1,x2) = (x1+x2-1)^2: both blue points land at 0 and both red points land at 1, with a threshold at 0.5 separating them.</desc>
<style>
.th { font: 600 14px system-ui, sans-serif; fill: #333; }
.ts { font: 12px system-ui, sans-serif; fill: #666; }
</style>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="th" x="170" y="40" text-anchor="middle">Input space (2D)</text>
<text class="ts" x="170" y="58" text-anchor="middle">XOR</text>

<g transform="translate(170,240)">
  <line x1="-30" y1="0" x2="160" y2="0" stroke="#999" stroke-width="0.5" marker-end="url(#arrow2)"/>
  <line x1="0" y1="30" x2="0" y2="-150" stroke="#999" stroke-width="0.5" marker-end="url(#arrow2)"/>
  <text class="ts" x="166" y="4">x₁</text>
  <text class="ts" x="8" y="-146">x₂</text>

  <line x1="-15" y1="-115" x2="115" y2="15" stroke="#BA7517" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <text class="ts" x="-20" y="-118" text-anchor="end" fill="#854F0B">x₁+x₂=1</text>

  <circle cx="0" cy="0" r="7" fill="#D85A30"/>
  <text class="ts" x="-12" y="18" text-anchor="end" fill="#993C1D">(0,0)</text>
  <circle cx="100" cy="0" r="7" fill="#378ADD"/>
  <text class="ts" x="100" y="20" text-anchor="middle" fill="#185FA5">(1,0)</text>
  <circle cx="0" cy="-100" r="7" fill="#378ADD"/>
  <text class="ts" x="-12" y="-96" text-anchor="end" fill="#185FA5">(0,1)</text>
  <circle cx="100" cy="-100" r="7" fill="#D85A30"/>
  <text class="ts" x="114" y="-96" fill="#993C1D">(1,1)</text>
</g>

<line x1="320" y1="240" x2="380" y2="240" stroke="#666" stroke-width="1" marker-end="url(#arrow2)"/>
<text class="th" x="350" y="226" text-anchor="middle">φ</text>
<text class="ts" x="350" y="258" text-anchor="middle">(x₁+x₂−1)²</text>

<text class="th" x="530" y="40" text-anchor="middle">Feature space (1D)</text>
<text class="ts" x="530" y="58" text-anchor="middle">A threshold separates the classes</text>

<g transform="translate(420,260)">
  <line x1="0" y1="0" x2="220" y2="0" stroke="#999" stroke-width="0.5" marker-end="url(#arrow2)"/>
  <text class="ts" x="226" y="4">h</text>

  <line x1="0" y1="-6" x2="0" y2="6" stroke="#999" stroke-width="0.5"/>
  <text class="ts" x="0" y="22" text-anchor="middle">0</text>
  <line x1="100" y1="-6" x2="100" y2="6" stroke="#999" stroke-width="0.5"/>
  <text class="ts" x="100" y="22" text-anchor="middle">0.5</text>
  <line x1="200" y1="-6" x2="200" y2="6" stroke="#999" stroke-width="0.5"/>
  <text class="ts" x="200" y="22" text-anchor="middle">1</text>

  <line x1="100" y1="-70" x2="100" y2="40" stroke="#BA7517" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="ts" x="100" y="-78" text-anchor="middle" fill="#854F0B">threshold</text>

  <circle cx="0" cy="-14" r="7" fill="#378ADD"/>
  <text class="ts" x="16" y="-10" fill="#185FA5">(1,0)</text>
  <circle cx="0" cy="-38" r="7" fill="#378ADD"/>
  <text class="ts" x="16" y="-34" fill="#185FA5">(0,1)</text>

  <circle cx="200" cy="-14" r="7" fill="#D85A30"/>
  <text class="ts" x="184" y="-10" text-anchor="end" fill="#993C1D">(0,0)</text>
  <circle cx="200" cy="-38" r="7" fill="#D85A30"/>
  <text class="ts" x="184" y="-34" text-anchor="end" fill="#993C1D">(1,1)</text>
</g>

<text class="ts" x="340" y="410" text-anchor="middle" fill="#666">Distance from the line x₁+x₂=1, squared: blues lie on it (distance 0), reds lie off it (distance 1).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
