<svg width="100%" viewBox="0 0 680 460" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
<title>Two sigmoid neurons separate XOR</title>
<desc>Left shows the four XOR points in 2D. Right shows the same points in the (h1, h2) plane after passing through two sigmoid neurons approximating OR and AND. The two blue points collapse onto each other and a diagonal line separates them from the two red points.</desc>
<style>
.th { font: 600 14px system-ui, sans-serif; fill: #333; }
.ts { font: 12px system-ui, sans-serif; fill: #666; }
</style>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="th" x="170" y="40" text-anchor="middle">Input space (2D)</text>
<text class="ts" x="170" y="58" text-anchor="middle">XOR</text>

<g transform="translate(170,240)">
  <line x1="-30" y1="0" x2="160" y2="0" stroke="#999" stroke-width="0.5" marker-end="url(#arrow3)"/>
  <line x1="0" y1="30" x2="0" y2="-150" stroke="#999" stroke-width="0.5" marker-end="url(#arrow3)"/>
  <text class="ts" x="166" y="4">x₁</text>
  <text class="ts" x="8" y="-146">x₂</text>

  <circle cx="0" cy="0" r="7" fill="#D85A30"/>
  <text class="ts" x="-12" y="18" text-anchor="end" fill="#993C1D">(0,0)</text>
  <circle cx="100" cy="0" r="7" fill="#378ADD"/>
  <text class="ts" x="100" y="20" text-anchor="middle" fill="#185FA5">(1,0)</text>
  <circle cx="0" cy="-100" r="7" fill="#378ADD"/>
  <text class="ts" x="-12" y="-96" text-anchor="end" fill="#185FA5">(0,1)</text>
  <circle cx="100" cy="-100" r="7" fill="#D85A30"/>
  <text class="ts" x="114" y="-96" fill="#993C1D">(1,1)</text>
</g>

<line x1="320" y1="240" x2="380" y2="240" stroke="#666" stroke-width="1" marker-end="url(#arrow3)"/>
<text class="th" x="350" y="226" text-anchor="middle">φ</text>
<text class="ts" x="350" y="258" text-anchor="middle">two sigmoids</text>

<text class="th" x="485" y="40" text-anchor="middle">Feature space (2D)</text>
<text class="ts" x="485" y="58" text-anchor="middle">Linearly separable by a line</text>

<g transform="translate(410,300)">
  <line x1="-20" y1="0" x2="170" y2="0" stroke="#999" stroke-width="0.5" marker-end="url(#arrow3)"/>
  <line x1="0" y1="20" x2="0" y2="-170" stroke="#999" stroke-width="0.5" marker-end="url(#arrow3)"/>
  <text class="ts" x="176" y="4">h₁ (≈OR)</text>
  <text class="ts" x="8" y="-166">h₂ (≈AND)</text>

  <text class="ts" x="-6" y="14" text-anchor="end">0</text>
  <line x1="120" y1="-4" x2="120" y2="4" stroke="#999" stroke-width="0.5"/>
  <text class="ts" x="120" y="14" text-anchor="middle">1</text>
  <line x1="-4" y1="-120" x2="4" y2="-120" stroke="#999" stroke-width="0.5"/>
  <text class="ts" x="-6" y="-116" text-anchor="end">1</text>

  <line x1="60" y1="20" x2="160" y2="-80" stroke="#BA7517" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="ts" x="166" y="-78" fill="#854F0B">h₁ − h₂ = 0.5</text>

  <circle cx="0" cy="0" r="7" fill="#D85A30"/>
  <text class="ts" x="-12" y="-4" text-anchor="end" fill="#993C1D">(0,0)</text>

  <circle cx="120" cy="0" r="7" fill="#378ADD"/>
  <text class="ts" x="120" y="22" text-anchor="middle" fill="#185FA5">(1,0) &amp; (0,1)</text>

  <circle cx="120" cy="-120" r="7" fill="#D85A30"/>
  <text class="ts" x="134" y="-116" fill="#993C1D">(1,1)</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
